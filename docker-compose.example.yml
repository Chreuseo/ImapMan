services:
  imapman:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11.7
    env_file: .env
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mariadb-data:
